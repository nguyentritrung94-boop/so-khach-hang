<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ Khách Hàng</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sổ KH">
<meta name="theme-color" content="#F3F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1614" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --fg:#14211D; --muted:#5E6E68; --line:#DCE3E0;
  --accent:#0E7458; --accent-ink:#FFFFFF; --accent-soft:#DDF0E9;
  --due:#B4630B; --due-soft:#FBEBD5; --danger:#B42318; --danger-soft:#FCE4E1;
  --s-new:#2F5FD0; --s-new-bg:#E3EAFB; --s-talk:#8A5A00; --s-talk-bg:#FBEFD2;
  --s-won:#0E7458; --s-won-bg:#DDF0E9; --s-pause:#5E6E68; --s-pause-bg:#E7ECEA;
  --hot:#D9480F; --hot-bg:#FDE6D8; --warm:#B7791F; --warm-bg:#FBF0D6; --cold:#3B6FB6; --cold-bg:#E2ECF8;
  --shadow:0 10px 30px rgba(20,33,29,.16);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1614; --surface:#18221F; --fg:#E6EEEB; --muted:#93A39D; --line:#2A3833;
  --accent:#3FBF95; --accent-ink:#06261C; --accent-soft:#16352B;
  --due:#F0A64A; --due-soft:#3A2810; --danger:#F27C70; --danger-soft:#3D1A17;
  --s-new:#8FAEF5; --s-new-bg:#1C2843; --s-talk:#F0C35A; --s-talk-bg:#352A10;
  --s-won:#3FBF95; --s-won-bg:#16352B; --s-pause:#93A39D; --s-pause-bg:#24302C;
  --hot:#FF8A57; --hot-bg:#3D2014; --warm:#F0C35A; --warm-bg:#352A10; --cold:#8FB4F0; --cold-bg:#1C2843;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title-wrap{display:flex;align-items:center;gap:10px;min-width:0}
h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.top-right{display:flex;align-items:center;gap:6px}
.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
@media (max-width:430px){.count{display:none} h1{font-size:19px}}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:16px;line-height:1;position:relative;flex:none}
.icon-btn .dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.icon-btn.spin span{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px;-webkit-appearance:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.active-filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.active-filters button{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.active-filters .clear{border-color:var(--line);background:none;color:var(--muted);font-weight:500}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;border-radius:6px;padding:1px 7px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.p::before{content:"#";opacity:.6}
.tag.plain{background:var(--bg);color:var(--muted)}
.tagline{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden;margin-top:3px}

.notice{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.notice.warn{color:var(--due);border-color:var(--due);background:var(--due-soft);border-style:solid}
.due-strip{background:var(--due-soft);color:var(--due);border:0;border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;text-align:left;width:100%}
.quick-add{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:12px 14px;font-weight:600;text-align:left;width:100%}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:active{background:var(--accent-soft)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--accent-soft);color:var(--accent);border:3px solid transparent}
.av.hot{border-color:var(--hot);background:var(--hot-bg);color:var(--hot)}
.av.warm{border-color:var(--warm);background:var(--warm-bg);color:var(--warm)}
.av.cold{border-color:var(--cold);background:var(--cold-bg);color:var(--cold)}
.row-main{min-width:0;display:flex;flex-direction:column;gap:1px}
.row-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap;letter-spacing:.01em}
.st-new{color:var(--s-new);background:var(--s-new-bg)}
.st-talk{color:var(--s-talk);background:var(--s-talk-bg)}
.st-won{color:var(--s-won);background:var(--s-won-bg)}
.st-pause{color:var(--s-pause);background:var(--s-pause-bg)}
.h-hot{color:var(--hot);background:var(--hot-bg)} .h-warm{color:var(--warm);background:var(--warm-bg)} .h-cold{color:var(--cold);background:var(--cold-bg)}
.due-tag{font-size:11.5px;font-weight:600;color:var(--due);font-variant-numeric:tabular-nums;white-space:nowrap}
.due-tag.soft{color:var(--muted)}

.empty{text-align:center;padding:40px 20px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:14px}
.empty strong{display:block;color:var(--fg);font-size:17px;margin-bottom:6px}

.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;
  border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 20px;box-shadow:var(--shadow);font-size:15px}

.scrim{position:fixed;inset:0;background:rgba(10,18,15,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:calc(100% - env(safe-area-inset-top,0px) - 12px);overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:10px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{left:50%;right:auto;width:640px;transform:translateX(-50%)}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet-inner{display:flex;flex-direction:column;gap:14px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sh-head h2{margin:0;font-size:20px;line-height:1.25;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:var(--bg);border-radius:50%;width:34px;height:34px;flex:none;font-size:18px;line-height:1}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.contact{display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:12px;padding:12px}
.phone{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;user-select:all;-webkit-user-select:all}
.contact-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:500;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.big{padding:12px;font-size:15px;font-weight:600}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"].hot{background:var(--hot-bg);border-color:var(--hot);color:var(--hot)}
.seg button[aria-pressed="true"].warm{background:var(--warm-bg);border-color:var(--warm);color:var(--warm)}
.seg button[aria-pressed="true"].cold{background:var(--cold-bg);border-color:var(--cold);color:var(--cold)}
.seg button[aria-pressed="true"].none{background:var(--bg);border-color:var(--fg);color:var(--fg)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.label-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.compose{display:flex;flex-direction:column;gap:8px}
textarea,.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:16px;-webkit-appearance:none}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
textarea{min-height:76px;resize:vertical}
.mic{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.mic.on{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px dashed var(--line);background:none;border-radius:999px;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.follow{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:12px;padding:10px 12px}
.follow-btns{display:flex;gap:6px;flex-wrap:wrap}
.follow-btns button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.follow-btns button[aria-pressed="true"]{background:var(--due-soft);border-color:var(--due);color:var(--due)}
.follow-now{font-size:13px;color:var(--muted)}
.follow-now b{color:var(--fg)}
.timeline{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px}
.note{position:relative;padding:0 0 14px 16px}
.note::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.note time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.note p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.note .del{border:0;background:none;color:var(--muted);font-size:12px;padding:0 0 0 8px}
form.edit{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.field .flabel{font-size:13px;font-weight:500;color:var(--muted)}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.two{grid-template-columns:1fr}}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px dashed var(--line);background:none;border-radius:8px;padding:6px 10px;font-size:13.5px;color:var(--muted)}
.pick button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);font-weight:600}
.dup{background:var(--due-soft);color:var(--due);border-radius:10px;padding:8px 10px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.dup button{border:0;background:none;color:var(--due);font-weight:700;text-decoration:underline;padding:0}
.confirm{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center}
.toast button{border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline;padding:0;font-size:14px}

/* ngăn lọc bên trái */
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:25;width:min(86vw,340px);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;
  transform:translateX(-105%);transition:transform .22s ease-out;overflow-y:auto;-webkit-overflow-scrolling:touch}
.drawer.open{transform:none}
#drawerScrim{z-index:24}
.drawer-head{display:flex;align-items:center;justify-content:space-between}
.drawer-head h2{margin:0;font-size:18px}
.dsec{display:flex;flex-direction:column;gap:6px}
.dlist{display:flex;flex-direction:column;gap:2px}
.dlist button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:500}
.dlist button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dlist .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500}
.dchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}

/* máy tính khoản vay */
.lv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lv-row{display:flex;flex-direction:column;gap:4px;min-width:0}
.lv-row.wide{grid-column:1/-1}
.lv-row label{font-size:13px;color:var(--muted);font-weight:500}
.lv-box{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px}
.lv-box:focus-within{border-color:var(--accent);outline:2px solid var(--accent-soft)}
.lv-box input{flex:1;min-width:0;border:0;background:none;padding:11px 0;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;outline:none;-webkit-appearance:none}
.lv-box span{font-size:14px;color:var(--muted);font-weight:500;margin-left:6px;white-space:nowrap}
.lv-sched{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lv-sched-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:var(--bg)}
.lv-sched-head b{font-size:14px}
.lv-sched table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;table-layout:fixed}
.lv-sched th{font-weight:600;color:var(--muted);text-align:right;padding:6px 8px;font-size:12px}
.lv-sched td{text-align:right;padding:6px 8px;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-sched th:first-child,.lv-sched td:first-child{text-align:left;width:58px}
.lv-sched td.pay{font-weight:700}
.lv-sched tr.promo-end td{border-top:2px solid var(--due)}
.lv-sched tfoot td{font-weight:700;background:var(--bg)}
.lv-msg{background:var(--bg);border-radius:12px;padding:12px;font-size:14px;white-space:pre-line;line-height:1.55}
/* thống kê */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:12px}
.stat .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:12.5px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:13.5px}
.bar .track{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.bar .fill{height:100%;border-radius:5px;background:var(--accent)}
.bar .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:400px;margin:0 auto}
.login .logo{width:72px;height:72px;border-radius:18px}
.login h1{font-size:26px}
.login p{margin:0;color:var(--muted)}
.login input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;font-size:20px;letter-spacing:.15em;text-align:center;-webkit-appearance:none}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}
  @media (min-width:700px){.sheet{animation:none}}}
</style>
</head>
<body>

<section class="login" id="login" hidden>
  <img class="logo" src="icon-192.png" alt="">
  <h1>Sổ Khách Hàng</h1>
  <p>Nhập mã truy cập để mở sổ. Chỉ cần nhập một lần trên máy này.</p>
  <form id="loginForm" novalidate style="display:flex;flex-direction:column;gap:10px">
    <input id="code" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Mã truy cập" aria-label="Mã truy cập">
    <button class="btn primary big" type="submit" id="loginBtn">Mở sổ</button>
    <p id="loginErr" style="color:var(--danger);font-size:14px" hidden></p>
  </form>
</section>

<div class="wrap" id="app" hidden>
  <header>
    <div class="top">
      <div class="title-wrap"><button class="icon-btn" id="menuBtn" type="button" aria-label="Lọc và sắp xếp"><span>☰</span><span class="dot" id="filterDot" hidden></span></button><h1>Sổ Khách Hàng</h1></div>
      <div class="top-right"><span class="count" id="count"></span>
        <button class="icon-btn" id="loanBtn" type="button" aria-label="Tính khoản vay"><span>🧮</span></button>
        <button class="icon-btn" id="statsBtn" type="button" aria-label="Thống kê"><span>📊</span></button>
        <button class="icon-btn" id="refresh" type="button" aria-label="Tải lại từ Google Sheet"><span>⟳</span></button></div>
    </div>
    <input id="q" class="search" type="search" placeholder="Tìm tên, số điện thoại, ghi chú…" autocomplete="off" inputmode="search">
    <div class="chips" id="chips" role="group" aria-label="Lọc theo trạng thái"></div>

  </header>
  <div id="notice" class="notice" hidden></div>
  <button id="due" class="due-strip" type="button" hidden></button>

<div id="drawerScrim" class="scrim" hidden></div>
<nav id="drawer" class="drawer" aria-label="Lọc và sắp xếp" hidden>
  <div class="drawer-head"><h2>Lọc &amp; sắp xếp</h2><button class="x" type="button" id="drawerClose" aria-label="Đóng">×</button></div>
  <div id="drawerBody" style="display:flex;flex-direction:column;gap:18px"></div>
</nav>
<div id="scrim" class="scrim" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden><div class="grab"></div><div id="sheetBody" class="sheet-inner"></div></div>
<div id="toast" class="toast" hidden><span id="toastText"></span><button id="toastAct" type="button" hidden></button></div>

<script>
/* ========= cấu hình ========= */
const API_URL = "https://script.google.com/macros/s/AKfycbxKpu-fw4o_bI0DOFLLAmE2ox2Boh5DwdWjSgrKtYWHd7fPn3hKvgjgT-A9RylTqdOB/exec";

const STATUS = [{k:"new",t:"Mới"},{k:"talk",t:"Đang tư vấn"},{k:"won",t:"Đã chốt"},{k:"pause",t:"Tạm dừng"}];
const HEAT = [{k:"hot",t:"Nóng",i:"🔥"},{k:"warm",t:"Ấm",i:"☀️"},{k:"cold",t:"Lạnh",i:"❄️"}];
const PTYPES = ["Liền kề","Chung cư","Shophouse","Biệt thự","Đất nền","Khác"];
const PAYMENTS = ["Vay ngân hàng","Trả thẳng","Chưa rõ"];
const BUDGETS = [{k:"lt10",t:"Dưới 10 tỷ",lo:0,hi:9.999},{k:"10-15",t:"10–15 tỷ",lo:10,hi:15},{k:"15-20",t:"15–20 tỷ",lo:15,hi:20},{k:"20-30",t:"20–30 tỷ",lo:20,hi:30},{k:"gt30",t:"Trên 30 tỷ",lo:30.001,hi:1e9},{k:"none",t:"Chưa rõ tài chính"}];
const STALE = [{k:"7",t:"Hơn 7 ngày chưa liên hệ",d:7},{k:"30",t:"Hơn 30 ngày chưa liên hệ",d:30}];
const SORTS = [{k:"recent",t:"Mới cập nhật"},{k:"stale",t:"Lâu chưa liên hệ"},{k:"follow",t:"Lịch hẹn gần nhất"},{k:"heat",t:"Nóng trước"},{k:"name",t:"Tên A–Z"}];
const QUICK = ["Đã gọi, hẹn gọi lại","Đã gửi báo giá","Khách đang cân nhắc","Hẹn đi xem nhà","Đã chốt","Không nghe máy","Thuê bao"];
const CALL_NOTE = "📞 Đã gọi điện", ZALO_NOTE = "💬 Đã nhắn Zalo";
const stName = k => (STATUS.find(s=>s.k===k)||STATUS[0]).t;
const heatOf = k => HEAT.find(h=>h.k===k);

let customers = {}, pending = [], token = "";
let filter="all", query="", openId=null, mode="view", confirmDel=false, formTags=[], formTypes=[];
let F = {project:"", heat:"", ptype:"", budget:"", payment:"", stale:""}, sortBy="recent";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = n => { const d=new Date(); d.setDate(d.getDate()+n); return ymd(d); };
const fmtDate = s => { if(!s) return ""; const [y,m,d]=s.split("-"); return `${d}/${m}/${y}`; };
const fmtTime = ms => { if(!ms) return ""; const d=new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())} · ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; };
const stamp = ms => { const d=new Date(ms); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const initials = n => (n||"?").trim().split(/\s+/).slice(-1)[0].charAt(0).toUpperCase() || "?";
const newId = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const isDue = c => c.nextFollow && c.nextFollow <= today() && c.status !== "won" && c.status !== "pause";
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[đĐ]/g,"d").toLowerCase();
const tagsOf = c => Array.isArray(c.projects) ? c.projects : [];
const typesOf = c => Array.isArray(c.ptypes) ? c.ptypes : [];
const telOf = p => String(p||"").replace(/[^\d+]/g,"");
const digits = p => { let d=String(p||"").replace(/\D/g,""); if(d.startsWith("84") && d.length>=11) d="0"+d.slice(2); if(d.length===9) d="0"+d; return d; };
const lastContact = c => Math.max(0, ...(c.notes||[]).map(n=>n.t||0));
const daysSince = ms => ms ? Math.floor((Date.now()-ms)/864e5) : Infinity;
function budgetRange(s){ const m=String(s||"").replace(/,/g,".").match(/\d+(\.\d+)?/g); if(!m) return null; const a=m.map(Number); return [Math.min(...a), Math.max(...a)]; }
const fmtBudget = s => s ? (/tỷ|ty|tr|triệu/i.test(s) ? s : s+" tỷ") : "";
const ls = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
             set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

let toastUndo=null;
function toast(msg, act, fn, ms){ const t=$("toast"); $("toastText").textContent=msg; const b=$("toastAct"); toastUndo=fn||null; b.hidden=!act; b.textContent=act||""; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>{ t.hidden=true; toastUndo=null; }, ms||(act?5000:1900)); }
$("toastAct").addEventListener("click", ()=>{ const f=toastUndo; toastUndo=null; $("toast").hidden=true; if(f) f(); });

/* ========= chuyển đổi dòng Google Sheet <-> khách ========= */
function toSheet(c, id){
  return { id, name:c.name||"", phone:c.phone||"", status:stName(c.status), projects:tagsOf(c).join(", "),
    need:c.need||"", company:c.company||"", address:c.address||"", nextFollow:fmtDate(c.nextFollow),
    // trên sheet: ghi chú cũ ở trên, mới ở dưới
    notes:(c.notes||[]).map((n,i)=>({...n,i})).sort((a,b)=>(a.t||0)-(b.t||0) || b.i-a.i).map(n=>(n.t?stamp(n.t)+" | ":"")+String(n.text).replace(/\s*\n\s*/g," ")).join("\n"),
    updated: stamp(c.updatedAt||Date.now()),
    heat: heatOf(c.heat) ? heatOf(c.heat).t : "", budget:c.budget||"", ptypes:typesOf(c).join(", "), payment:c.payment||"",
    created: c.createdAt ? stamp(c.createdAt) : "" };
}
function parseStamp(s){
  const m=String(s||"").match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?(?:\s+(\d{1,2}):(\d{2}))?/);
  if(!m) return 0;
  return new Date(+(m[3]||new Date().getFullYear()), +m[2]-1, +m[1], +(m[4]||9), +(m[5]||0)).getTime();
}
function parseNotes(txt){
  const out=[];
  String(txt||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const m=l.match(/^(\d{1,2}\/\d{1,2}(?:\/\d{4})?(?:\s+\d{1,2}:\d{2})?)\s*[|:]?\s*(.*)$/);
    if(m && parseStamp(m[1])) out.push({t:parseStamp(m[1]), text:m[2]||l});
    else if(out.length) out[out.length-1].text += "\n"+l;
    else out.push({t:0,text:l});
  });
  // trong app: mới nhất lên đầu (sheet viết theo thứ tự nào cũng được)
  return out.map((n,i)=>({...n,i})).sort((a,b)=>(b.t||0)-(a.t||0) || b.i-a.i).map(({i,...n})=>n);
}
const splitList = s => String(s||"").split(/[,;]/).map(x=>x.trim()).filter(Boolean);
function fromSheet(r){
  let phone=String(r.phone||"").trim(); if(/^\d{9}$/.test(phone)) phone="0"+phone;
  const st=STATUS.find(s=>norm(s.t)===norm(r.status));
  const ht=HEAT.find(h=>norm(h.t)===norm(r.heat) || h.k===norm(r.heat));
  let nf=""; const m=String(r.nextFollow||"").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(m) nf=`${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  else if(/^\d{4}-\d{2}-\d{2}$/.test(r.nextFollow)) nf=r.nextFollow;
  const notes=parseNotes(r.notes);
  const upd=parseStamp(r.updated)||Math.max(0,...notes.map(n=>n.t));
  return { name:r.name, phone, status:st?st.k:"new", projects:splitList(r.projects),
    need:r.need||"", company:r.company||"", address:r.address||"", nextFollow:nf, notes, updatedAt:upd,
    heat: ht?ht.k:"", budget:String(r.budget||"").trim(), ptypes:splitList(r.ptypes), payment:String(r.payment||"").trim(),
    createdAt: parseStamp(r.created) || Math.min(...notes.map(n=>n.t).filter(Boolean).concat([upd||Date.now()])) };
}

/* ========= đồng bộ với Google Sheet ========= */
async function api(method, body){
  const url = method==="GET" ? API_URL+"?k="+encodeURIComponent(token)+"&t="+Date.now() : API_URL;
  const res = await fetch(url, method==="GET" ? {cache:"no-store"} : {method:"POST", body:JSON.stringify({k:token,...body})});
  const j = await res.json();
  if(!j.ok) throw Object.assign(new Error(j.error||"error"),{code:j.error});
  return j;
}
function saveCache(){ ls.set("skh-cache",customers); ls.set("skh-pending",pending); }
function showNotice(t,warn){ const n=$("notice"); n.textContent=t||""; n.hidden=!t; n.classList.toggle("warn",!!warn); }
function syncNote(){
  if(pending.length) showNotice(`Còn ${pending.length} thay đổi chưa lưu lên Google Sheet. App sẽ tự gửi lại khi có mạng.`, true);
  else if(!navigator.onLine) showNotice("Đang không có mạng. Anh vẫn xem được danh sách đã lưu trên máy.");
  else showNotice("");
}
let loading=false;
async function load(){
  if(loading) return; loading=true; $("refresh").classList.add("spin");
  try{
    await flush();
    const j=await api("GET");
    const next={}; j.customers.forEach(r=>{ next[r.id]=fromSheet(r); });
    pending.forEach(op=>{ if(op.action==="save") next[op.customer.id]=customers[op.customer.id]||next[op.customer.id]; if(op.action==="delete") delete next[op.id]; });
    customers=next; saveCache(); render();
  }catch(e){
    if(e.code==="auth"){ logout("Mã truy cập không còn đúng, anh nhập lại giúp em."); return; }
    if(!Object.keys(customers).length) showNotice("Chưa tải được danh sách. Kiểm tra mạng rồi bấm ⟳ để thử lại.", true);
  }finally{ loading=false; $("refresh").classList.remove("spin"); syncNote(); }
}
let flushing=false, inflight=null;
async function flush(){
  if(flushing) return; flushing=true;
  try{ while(pending.length){ inflight=pending[0]; await api("POST", inflight); const i=pending.indexOf(inflight); if(i>=0) pending.splice(i,1); inflight=null; saveCache(); } }
  catch(e){ inflight=null; if(e.code==="auth") logout("Mã truy cập không còn đúng, anh nhập lại giúp em."); }
  finally{ flushing=false; inflight=null; syncNote(); }
}
function queue(op){
  // gộp các lần lưu cùng một khách đang chờ (trừ lần đang gửi dở)
  if(op.action==="save"){ pending=pending.filter(p=>p===inflight || !(p.action==="save"&&p.customer.id===op.customer.id)); }
  if(op.action==="delete"){ pending=pending.filter(p=>p===inflight || !(p.action==="save"&&p.customer.id===op.id)); }
  pending.push(op); saveCache(); flush();
}
const store = {
  save(id,obj){ customers[id]=obj; render(); queue({action:"save", customer:toSheet(obj,id)}); },
  remove(id){ delete customers[id]; render(); queue({action:"delete", id}); }
};
function patch(id, fn){ const c=structuredClone(customers[id]); fn(c); c.updatedAt=Date.now(); store.save(id,c); return c; }
addEventListener("online", ()=>{ syncNote(); load(); });
addEventListener("offline", syncNote);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && token) load(); });
setInterval(()=>{ if(pending.length && navigator.onLine) flush(); }, 30000);

/* ========= đăng nhập bằng mã ========= */
function logout(msg){ token=""; ls.set("skh-token",""); $("app").hidden=true; $("fab").hidden=true; $("login").hidden=false; if(msg){ $("loginErr").textContent=msg; $("loginErr").hidden=false; } }
$("loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const code=$("code").value.normalize("NFC").toLowerCase().replace(/[\s​]/g,""); if(!code) return;
  $("loginBtn").disabled=true; $("loginBtn").textContent="Đang mở…"; $("loginErr").hidden=true;
  token=code;
  try{ await api("GET"); ls.set("skh-token",token); start(); }
  catch(err){ token=""; $("loginErr").textContent = err.code==="auth" ? "Mã chưa đúng, anh kiểm tra lại." : "Không kết nối được. Kiểm tra mạng rồi thử lại."; $("loginErr").hidden=false; }
  finally{ $("loginBtn").disabled=false; $("loginBtn").textContent="Mở sổ"; }
});
function start(){ $("login").hidden=true; $("app").hidden=false; $("fab").hidden=false; render(); load(); }

/* ========= lọc & sắp xếp ========= */
function allTags(){
  const m=new Map();
  Object.values(customers).forEach(c=>tagsOf(c).forEach(t=>{ const k=norm(t); if(!m.has(k)) m.set(k,{t,n:0}); m.get(k).n++; }));
  return [...m.values()].sort((a,b)=>b.n-a.n || a.t.localeCompare(b.t,"vi"));
}
function allTypes(){ const s=new Set(PTYPES); Object.values(customers).forEach(c=>typesOf(c).forEach(t=>s.add(t))); return [...s]; }
function passBudget(c,k){
  if(!k) return true; const b=BUDGETS.find(x=>x.k===k); const r=budgetRange(c.budget);
  if(k==="none") return !r; if(!r) return false; return r[1]>=b.lo && r[0]<=b.hi;
}
function matches(c, skip){
  if(skip!=="status"){ if(filter==="due" && !isDue(c)) return false; if(!["all","due"].includes(filter) && c.status!==filter) return false; }
  if(F.project && !tagsOf(c).some(t=>norm(t)===norm(F.project))) return false;
  if(F.heat && (F.heat==="none" ? c.heat : c.heat!==F.heat)) return false;
  if(F.ptype && !typesOf(c).some(t=>norm(t)===norm(F.ptype))) return false;
  if(F.payment && norm(c.payment)!==norm(F.payment)) return false;
  if(!passBudget(c,F.budget)) return false;
  if(F.stale){ const d=STALE.find(s=>s.k===F.stale).d; if(daysSince(lastContact(c))<=d || c.status==="won") return false; }
  return true;
}
const activeCount = () => Object.values(F).filter(Boolean).length;
function filterLabel(k,v){
  if(k==="project") return "#"+v;
  if(k==="heat") return v==="none" ? "Chưa đánh giá" : heatOf(v).i+" "+heatOf(v).t;
  if(k==="budget") return BUDGETS.find(b=>b.k===v).t;
  if(k==="stale") return STALE.find(s=>s.k===v).t;
  return v;
}
function renderActive(){
  const el=$("activeFilters"); const ks=Object.keys(F).filter(k=>F[k]);
  el.hidden=!ks.length && sortBy==="recent";
  el.innerHTML = ks.map(k=>`<button type="button" data-unf="${k}">${esc(filterLabel(k,F[k]))} ×</button>`).join("")
    + (sortBy!=="recent" ? `<button type="button" data-unsort="1">↕ ${esc(SORTS.find(s=>s.k===sortBy).t)} ×</button>` : "")
    + (ks.length>1 ? `<button type="button" class="clear" data-clearall="1">Xoá hết</button>` : "");
  const dot=$("filterDot"); const n=activeCount(); dot.hidden=!n; dot.textContent=n;
}
function renderDrawer(){
  const base=Object.values(customers);
  const cnt = fn => base.filter(c=>fn(c)).length;
  const sec = (title, html) => `<div class="dsec"><span class="label">${title}</span>${html}</div>`;
  const chips = (key, items) => `<div class="dchips">${items.map(i=>`<button type="button" data-f="${key}" data-v="${esc(i.k)}" aria-pressed="${F[key]===i.k}">${esc(i.t)}${i.n!=null?` · ${i.n}`:""}</button>`).join("")}</div>`;
  const tags=allTags();
  $("drawerBody").innerHTML =
    sec("Dự án", `<div class="dlist"><button type="button" data-f="project" data-v="" aria-pressed="${!F.project}"><span>Tất cả dự án</span><span class="n">${base.length}</span></button>` +
      tags.map(x=>`<button type="button" data-f="project" data-v="${esc(x.t)}" aria-pressed="${norm(F.project)===norm(x.t)}"><span>#${esc(x.t)}</span><span class="n">${x.n}</span></button>`).join("") + `</div>`) +
    sec("Mức quan tâm", chips("heat", HEAT.map(h=>({k:h.k,t:h.i+" "+h.t,n:cnt(c=>c.heat===h.k)})).concat([{k:"none",t:"Chưa đánh giá",n:cnt(c=>!c.heat)}]))) +
    sec("Tài chính", chips("budget", BUDGETS.map(b=>({k:b.k,t:b.t,n:cnt(c=>passBudget(c,b.k))})))) +
    sec("Loại sản phẩm", chips("ptype", allTypes().map(t=>({k:t,t,n:cnt(c=>typesOf(c).some(x=>norm(x)===norm(t)))})))) +
    sec("Thanh toán", chips("payment", PAYMENTS.map(p=>({k:p,t:p,n:cnt(c=>norm(c.payment)===norm(p))})))) +
    sec("Liên hệ", chips("stale", STALE.map(s=>({k:s.k,t:s.t,n:cnt(c=>c.status!=="won" && daysSince(lastContact(c))>s.d)})))) +
    sec("Sắp xếp", `<div class="dchips">${SORTS.map(s=>`<button type="button" data-sort="${s.k}" aria-pressed="${sortBy===s.k}">${esc(s.t)}</button>`).join("")}</div>`) +
    (activeCount() ? `<button class="btn" type="button" data-clearall="1">Xoá tất cả bộ lọc</button>` : "");
}
function openDrawer(){ renderDrawer(); $("drawer").hidden=false; $("drawerScrim").hidden=false; requestAnimationFrame(()=>$("drawer").classList.add("open")); }
function closeDrawer(){ const d=$("drawer"); d.classList.remove("open"); $("drawerScrim").hidden=true; setTimeout(()=>{ if(!d.classList.contains("open")) d.hidden=true; },230); }
function saveFilters(){ ls.set("skh-filters",{F,sortBy}); }
function setF(k,v){ F[k] = F[k]===v && k!=="project" ? "" : v; saveFilters(); render(); renderDrawer(); }

/* ========= danh sách ========= */
function renderChips(){
  const all=Object.values(customers).filter(c=>matches(c,"status"));
  const items=[{k:"all",t:"Tất cả",n:all.length},{k:"due",t:"Cần gọi",n:all.filter(isDue).length},...STATUS.map(s=>({k:s.k,t:s.t,n:all.filter(c=>c.status===s.k).length}))];
  $("chips").innerHTML = items.map(i=>`<button class="chip" type="button" data-f="${i.k}" aria-pressed="${filter===i.k}">${esc(i.t)} · ${i.n}</button>`).join("");
}
function sortRows(rows){
  const heatRank = c => ({hot:0,warm:1,cold:2})[c.heat] ?? 3;
  const by = {
    recent:(a,b)=>(isDue(b)-isDue(a)) || ((b.updatedAt||0)-(a.updatedAt||0)),
    stale:(a,b)=>lastContact(a)-lastContact(b),
    follow:(a,b)=>(a.nextFollow||"9999").localeCompare(b.nextFollow||"9999") || ((b.updatedAt||0)-(a.updatedAt||0)),
    heat:(a,b)=>heatRank(a)-heatRank(b) || (isDue(b)-isDue(a)) || ((b.updatedAt||0)-(a.updatedAt||0)),
    name:(a,b)=>String(a.name).split(/\s+/).pop().localeCompare(String(b.name).split(/\s+/).pop(),"vi") || String(a.name).localeCompare(String(b.name),"vi")
  };
  return rows.sort(by[sortBy]||by.recent);
}
function contactText(ms){ const d=daysSince(ms); if(d===Infinity) return "Chưa có liên hệ"; if(d===0) return "Liên hệ hôm nay"; if(d===1) return "Liên hệ hôm qua"; return `Liên hệ ${d} ngày trước`; }
function render(){
  renderChips(); renderActive();
  const all=Object.entries(customers).map(([id,c])=>({id,...c}));
  $("count").textContent = all.length ? `${all.length} khách` : "";
  const dueN=all.filter(isDue).length;
  const ds=$("due"); ds.hidden=!dueN||filter==="due"; ds.textContent=`⏰ Có ${dueN} khách cần liên hệ hôm nay`;
  const q=norm(query), qd=query.replace(/\D/g,"");
  let rows=all.filter(c=>{
    if(!matches(c)) return false;
    if(!q) return true;
    return norm([c.name,c.phone,c.company,c.need,c.budget,c.payment,typesOf(c).join(" "),tagsOf(c).join(" "),(c.notes||[]).map(n=>n.text).join(" ")].join(" ")).includes(q) || (qd.length>=3 && digits(c.phone).includes(qd.replace(/^84/,"0")));
  });

  // gõ số điện thoại chưa có trong sổ → gợi ý thêm nhanh

  const exists=phoneLike && all.some(c=>digits(c.phone)===qdig);
  qa.hidden=!(phoneLike && !exists); qa.textContent=`+ Thêm khách mới với số ${qdig}`; qa.dataset.phone=qdig;
  const L=$("list");
  if(!all.length) L.innerHTML = loading||!navigator.onLine ? `<div class="empty"><strong>Đang tải danh sách…</strong>Lấy dữ liệu từ Google Sheet của anh.</div>`

  else if(!rows.length) L.innerHTML = phoneLike&&!exists ? "" : `<div class="empty"><strong>Không tìm thấy</strong>Thử từ khoá khác hoặc bỏ bớt bộ lọc.</div>`;
  else L.innerHTML=`<div class="list">${rows.map(c=>{
    const last=(c.notes||[])[0]; let sub=last?last.text:(c.need||c.company||c.phone||"");
    if(sortBy==="stale") sub=contactText(lastContact(c))+(last?` · ${last.text}`:"");
    const side = isDue(c) ? `<span class="due-tag">Gọi ${c.nextFollow===today()?"hôm nay":fmtDate(c.nextFollow)}</span>`
      : (c.nextFollow&&c.status!=="won" ? `<span class="due-tag soft">Hẹn ${fmtDate(c.nextFollow)}</span>` : "");
    const extra = [c.budget?`<span class="tag plain">${esc(fmtBudget(c.budget))}</span>`:"", ...typesOf(c).map(t=>`<span class="tag plain">${esc(t)}</span>`), ...tagsOf(c).map(t=>`<span class="tag p">${esc(t)}</span>`)].join("");
    return `<button class="row" type="button" data-id="${esc(c.id)}">
      <span class="av ${esc(c.heat||"")}" aria-hidden="true">${esc(initials(c.name))}</span>
      <span class="row-main"><span class="row-name">${c.heat==="hot"?"🔥 ":""}${esc(c.name)}</span><span class="row-sub">${esc(sub)}</span>${extra?`<span class="tagline">${extra}</span>`:""}</span>
      <span class="row-side"><span class="pill st-${esc(c.status||"new")}">${esc(stName(c.status))}</span>${side}</span></button>`;}).join("")}</div>`;
  if(openId && mode==="view" && customers[openId] && customers[openId]!==renderDetail.last) renderDetail();
  if(openId && !customers[openId] && mode!=="new") closeSheet();
}

const LOAN_DEF={price:20, ltv:50, yrs:25, r1:6.5, m1:24, r2:10.5, g:0, method:"dec"};
let L={...LOAN_DEF, ...(ls.get("skh-loan",{})||{})}, loanFor=null;
const vn = (x,d=1) => (+x).toFixed(d).replace(/\.?0+$/,"").replace(".",",");
const money = v => { const m=v/1e6; return m>=1000 ? vn(m/1000, m>=10000?1:2)+" tỷ" : Math.round(m).toLocaleString("vi-VN")+" tr"; };
function loanCalc(){
  const P=L.price*1e9*L.ltv/100, n=L.yrs*12, r1=L.r1/1200, r2=L.r2/1200, m1=L.m1, g=Math.min(L.g,n-1);
  let bal=P, totI=0, first=0, after=0, ann=0, lastR=null; const sched=[];
  for(let k=0;k<n;k++){
    const r=k<m1?r1:r2, it=bal*r; let pr=0;
    if(k>=g){ if(L.method==="dec") pr=P/(n-g); else { if(r!==lastR||k===g){ const left=n-k; ann = r===0 ? bal/left : bal*r/(1-Math.pow(1+r,-left)); lastR=r; } pr=ann-it; } }
    pr=Math.min(pr,bal); const pay=pr+it; if(k===0) first=pay; if(k===m1) after=pay; totI+=it; bal-=pr;
    sched.push({m:k+1, pr, it, pay, bal:Math.max(0,bal)});
  }
  if(m1===0||m1>=n) after=first;
  return {P, own:L.price*1e9-P, first, after, totI, inc:Math.max(first,after)/0.5, sched, n};
}
function loanText(c){
  const x=loanCalc(), way=L.method==="dec"?"tính lãi theo dư nợ giảm dần":"trả đều hằng tháng";
  const who = c ? (c.name+": c") : "C";

    `• Tháng đầu: khoảng ${money(x.first)}\n`+
    (L.m1 ? `• ${L.m1} tháng đầu lãi ${vn(L.r1)}%, sau đó ${vn(L.r2)}%: tháng đầu sau ưu đãi khoảng ${money(x.after)}\n` : `• Lãi suất ${vn(L.r2)}%/năm\n`)+
    (L.g ? `• Ân hạn gốc ${L.g} tháng đầu (chỉ trả lãi)\n` : "")+
    `Số liệu tham khảo, ngân hàng sẽ báo chính xác khi duyệt hồ sơ.`;
}

      ${c?`<button class="btn" type="button" data-act="loansave">Lưu vào nhật ký khách</button>`:""}
      <button class="btn" type="button" data-act="loanreset">Đặt lại</button></div>
    <p style="margin:0;font-size:12.5px;color:var(--muted)">“Thu nhập nên có” tính theo mức trả nợ không quá 50% thu nhập. Kết quả chỉ để tư vấn nhanh.</p>`;
  loanUpdate(); $("sheet").scrollTop=0;
}
function loanUpdate(){
  const x=loanCalc(); const c=loanFor?customers[loanFor]:null;
  $("lvRes").innerHTML=[["Vốn tự có",money(x.own)],["Số tiền vay",money(x.P)],["Tháng đầu trả",money(x.first)],["Tháng đầu sau ưu đãi",money(x.after)],["Tổng lãi cả kỳ",money(x.totI)],["Thu nhập nên có",money(x.inc)+"/th"]]
    .map(([k,v])=>`<div class="stat"><div class="v" style="font-size:21px">${v}</div><div class="k">${k}</div></div>`).join("");
  $("lvMsg").textContent=loanText(c);
  renderSched(x);
  const {price, ...keep}=L; ls.set("skh-loan",keep);
}
let loanYear=1;
const trv = v => { const m=v/1e6; return m>=1000 ? vn(m/1000,2)+" tỷ" : vn(m,1)+" tr"; };
function yearRows(x){ const a=(loanYear-1)*12; return x.sched.slice(a, a+12); }
function renderSched(x){
  const years=Math.max(1,Math.ceil(x.n/12)); loanYear=Math.min(Math.max(1,loanYear),years);
  const rows=yearRows(x); if(!rows.length){ $("lvSched").innerHTML=""; return; }
  const sum=k=>rows.reduce((s,r)=>s+r[k],0);
  $("lvSched").innerHTML=`
    <div class="lv-sched-head"><button class="btn small" type="button" data-act="lyprev" ${loanYear<=1?"disabled":""} aria-label="Năm trước">‹</button>
      <b>Năm ${loanYear} · tháng ${rows[0].m}–${rows[rows.length-1].m}</b>
      <button class="btn small" type="button" data-act="lynext" ${loanYear>=years?"disabled":""} aria-label="Năm sau">›</button></div>
    <table><thead><tr><th>Tháng</th><th>Gốc</th><th>Lãi</th><th>Phải trả</th><th>Còn nợ</th></tr></thead>
    <tbody>${rows.map(r=>`<tr class="${r.m===L.m1+1&&L.m1>0?"promo-end":""}"><td>${r.m}</td><td>${trv(r.pr)}</td><td>${trv(r.it)}</td><td class="pay">${trv(r.pay)}</td><td>${trv(r.bal)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td>Cộng</td><td>${trv(sum("pr"))}</td><td>${trv(sum("it"))}</td><td>${trv(sum("pay"))}</td><td></td></tr></tfoot></table>
    <div style="display:flex;gap:8px;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--bg)">
      <span style="font-size:12px;color:var(--muted)">${L.m1>0&&L.m1<x.n?`Vạch cam: tháng ${L.m1+1} bắt đầu lãi ${vn(L.r2)}%`:""}</span>
      <button class="btn small" type="button" data-act="schedcopy">Chép bảng</button></div>`;
}
function schedText(x){
  const rows=yearRows(x), c=loanFor?customers[loanFor]:null;
  return `${c?c.name+" – ":""}Số tiền trả năm ${loanYear} (vay ${trv(x.P)}, ${L.yrs} năm):\n`+
    rows.map(r=>`Tháng ${r.m}: ${trv(r.pay)} (gốc ${trv(r.pr)} + lãi ${trv(r.it)})`).join("\n")+
    `\nCộng ${rows.length} tháng: ${trv(rows.reduce((s,r)=>s+r.pay,0))}\nSố liệu tham khảo, ngân hàng sẽ báo chính xác khi duyệt hồ sơ.`;
}

function openCustomer(id){ stopMic(); openId=id; mode="view"; confirmDel=false; renderDetail.last=null; openSheet(); renderDetail(); $("sheet").scrollTop=0; }
function openNew(prefill){ stopMic(); openId=null; mode="new"; openSheet(); renderForm(prefill); $("sheet").scrollTop=0; if(!prefill) setTimeout(()=>$("f-phone")&&$("f-phone").focus(),60); else setTimeout(()=>$("f-name")&&$("f-name").focus(),60); }

/* ========= ghi âm giọng nói ========= */
let rec=null, recBase="";
function stopMic(){ if(rec){ try{ rec.stop(); }catch(e){} rec=null; } const b=$("micBtn"); if(b){ b.classList.remove("on"); b.textContent="🎤 Nói"; } }
function startMic(){
  const ta=$("noteText"); const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ ta.focus(); toast("Bấm biểu tượng 🎤 trên bàn phím iPhone để nói", null, null, 4000); return; }
  if(rec){ stopMic(); return; }
  try{
    rec=new SR(); rec.lang="vi-VN"; rec.interimResults=true; rec.continuous=true;
    recBase = ta.value ? ta.value.trim()+" " : "";
    rec.onresult = e => { let s=""; for(let i=0;i<e.results.length;i++) s+=e.results[i][0].transcript; ta.value = recBase + s; };
    rec.onerror = e => { stopMic(); ta.focus(); toast(e.error==="not-allowed"||e.error==="service-not-allowed" ? "Máy chưa cho dùng micro ở đây. Bấm 🎤 trên bàn phím để nói." : "Không nghe rõ, anh thử lại", null, null, 4000); };
    rec.onend = () => stopMic();
    rec.start(); const b=$("micBtn"); b.classList.add("on"); b.textContent="■ Dừng";
  }catch(err){ stopMic(); ta.focus(); toast("Bấm biểu tượng 🎤 trên bàn phím iPhone để nói", null, null, 4000); }
}

/* ========= sự kiện ========= */
$("q").addEventListener("input", e=>{ query=e.target.value; render(); });
$("chips").addEventListener("click", e=>{ const b=e.target.closest("[data-f]"); if(b){ filter=b.dataset.f; render(); } });
$("activeFilters").addEventListener("click", e=>{
  const u=e.target.closest("[data-unf]"); if(u){ F[u.dataset.unf]=""; saveFilters(); render(); return; }
  if(e.target.closest("[data-unsort]")){ sortBy="recent"; saveFilters(); render(); return; }
  if(e.target.closest("[data-clearall]")){ Object.keys(F).forEach(k=>F[k]=""); saveFilters(); render(); }
});
$("drawerBody").addEventListener("click", e=>{
  const f=e.target.closest("[data-f]"); if(f){ setF(f.dataset.f, f.dataset.v); if(f.dataset.f==="project") closeDrawer(); return; }
  const s=e.target.closest("[data-sort]"); if(s){ sortBy=s.dataset.sort; saveFilters(); render(); renderDrawer(); return; }
  if(e.target.closest("[data-clearall]")){ Object.keys(F).forEach(k=>F[k]=""); saveFilters(); render(); renderDrawer(); }
});
$("due").addEventListener("click", ()=>{ filter="due"; render(); });
$("quickAdd").addEventListener("click", ()=>{ openNew({phone:$("quickAdd").dataset.phone}); });
$("list").addEventListener("click", e=>{ const r=e.target.closest(".row"); if(r) openCustomer(r.dataset.id); });
$("fab").addEventListener("click", ()=>openNew());
$("refresh").addEventListener("click", ()=>load());
$("statsBtn").addEventListener("click", ()=>{ openId=null; mode="stats"; openSheet(); renderStats(); $("sheet").scrollTop=0; });
$("scrim").addEventListener("click", closeSheet);
$("menuBtn").addEventListener("click", openDrawer);
$("drawerClose").addEventListener("click", closeDrawer);
$("drawerScrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ if(!$("sheet").hidden) closeSheet(); else closeDrawer(); } });
(()=>{ // vuốt từ mép trái để mở ngăn lọc, vuốt sang trái để đóng
  let sx=null, sy=0, mode2="";
  addEventListener("touchstart", e=>{
    const t=e.touches[0]; const open=$("drawer").classList.contains("open");
    if(!$("app").hidden && $("sheet").hidden && (open || t.clientX<28)){ sx=t.clientX; sy=t.clientY; mode2=open?"close":"open"; } else sx=null;
  }, {passive:true});
  addEventListener("touchmove", e=>{
    if(sx==null) return; const t=e.touches[0], dx=t.clientX-sx, dy=Math.abs(t.clientY-sy);
    if(dy>40 && dy>Math.abs(dx)){ sx=null; return; }
    if(mode2==="open" && dx>50){ sx=null; openDrawer(); }
    else if(mode2==="close" && dx<-50){ sx=null; closeDrawer(); }
  }, {passive:true});
  addEventListener("touchend", ()=>{ sx=null; }, {passive:true});
})();

$("sheetBody").addEventListener("keydown", e=>{ if(e.target.id==="f-tag" && e.key==="Enter"){ e.preventDefault(); addTagFromInput(); } });
$("sheetBody").addEventListener("input", e=>{
  if(e.target.id==="f-phone") checkDup();
  const lv=e.target.dataset && e.target.dataset.lv;
  if(lv){ const [lo,hi]=LIMITS[lv]; L[lv]=Math.min(hi,Math.max(lo,numIn(e.target.value))); loanUpdate(); }
});
$("loanBtn").addEventListener("click", ()=>openLoan(null));
$("sheetBody").addEventListener("change", e=>{
  if(e.target.id==="followIn" && openId){ const v=e.target.value; patch(openId,c=>{ c.nextFollow=v; }); toast(v?`Đã hẹn gọi lại ${fmtDate(v)}`:"Đã bỏ hẹn"); }
});
$("sheetBody").addEventListener("click", async e=>{
  const pk=e.target.closest("[data-pick]");
  if(pk){ const t=pk.dataset.pick; const i=formTags.findIndex(f=>norm(f)===norm(t)); if(i>=0) formTags.splice(i,1); else formTags.push(t); renderTagPick(); return; }
  const pt=e.target.closest("[data-ptype]");
  if(pt){ const t=pt.dataset.ptype; const i=formTypes.indexOf(t); if(i>=0) formTypes.splice(i,1); else formTypes.push(t); renderTypePick(); return; }
  const ff=e.target.closest("[data-ffollow]"); if(ff){ $("f-follow").value=ff.dataset.ffollow; return; }
  const op=e.target.closest("[data-openid]"); if(op){ openCustomer(op.dataset.openid); return; }
  const lg=e.target.closest("[data-log]");
  if(lg && openId){ // tự ghi lần gọi / nhắn Zalo vào nhật ký
    const id=openId, text = lg.dataset.log==="call" ? CALL_NOTE : ZALO_NOTE, t=Date.now();
    setTimeout(()=>{ patch(id,c=>{ c.notes=c.notes||[]; c.notes.unshift({t,text}); if(c.status==="new") c.status="talk"; });
      toast(`Đã ghi “${text}” vào nhật ký`, "Hoàn tác", ()=>patch(id,c=>{ c.notes=(c.notes||[]).filter(n=>!(n.t===t&&n.text===text)); })); }, 50);
    return; // để link tự mở trình gọi / Zalo
  }
  if(e.target.closest('[data-act="addtag"]')){ addTagFromInput(); return; }
  const lm=e.target.closest("[data-lmethod]");
  if(lm){ L.method=lm.dataset.lmethod; document.querySelectorAll("[data-lmethod]").forEach(x=>x.setAttribute("aria-pressed", x===lm)); loanUpdate(); return; }
  const ht=e.target.closest("[data-heat]");
  if(ht && openId){ const v=ht.dataset.heat; patch(openId,c=>{ c.heat=v; }); toast(v?`Đã đánh dấu ${heatOf(v).i} ${heatOf(v).t}`:"Đã bỏ đánh giá"); return; }
  const fl=e.target.closest("[data-follow]");
  if(fl && openId){ const v=fl.dataset.follow; patch(openId,c=>{ c.nextFollow=v; }); toast(v?`Đã hẹn gọi lại ${fmtDate(v)}`:"Đã bỏ hẹn"); return; }
  const q=e.target.closest("[data-quick]");
  if(q){ const t=$("noteText"); t.value = t.value ? t.value.trim()+". "+q.dataset.quick : q.dataset.quick; t.focus(); return; }
  const dn=e.target.closest("[data-delnote]");
  if(dn){ patch(openId,c=>{ c.notes.splice(+dn.dataset.delnote,1); }); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, c=customers[openId];
  if(act==="close") closeSheet();
  else if(act==="back"){ mode="view"; renderDetail.last=null; renderDetail(); }
  else if(act==="edit"){ stopMic(); mode="edit"; renderForm(); $("sheet").scrollTop=0; }
  else if(act==="askdel"){ confirmDel=true; renderDetail.last=null; renderDetail(); }
  else if(act==="nodel"){ confirmDel=false; renderDetail.last=null; renderDetail(); }
  else if(act==="del"){ const name=c.name; store.remove(openId); closeSheet(); toast(`Đã xoá ${name}`); }
  else if(act==="mic") startMic();
  else if(act==="loan") openLoan(openId);
  else if(act==="loanback"){ const id=loanFor; loanFor=null; openCustomer(id); }
  else if(act==="loanreset"){ const p=L.price; L={...LOAN_DEF, price:p}; openLoan(loanFor); }
  else if(act==="lyprev"){ loanYear--; renderSched(loanCalc()); }
  else if(act==="lynext"){ loanYear++; renderSched(loanCalc()); }
  else if(act==="schedcopy"){
    const t=schedText(loanCalc());
    try{ await navigator.clipboard.writeText(t); toast("Đã chép bảng, mở Zalo để dán"); }
    catch(err){ toast("Máy chưa cho chép tự động, anh thử lại"); }
  }
  else if(act==="loancopy"){
    const t=$("lvMsg").textContent;
    try{ await navigator.clipboard.writeText(t); toast("Đã chép tin nhắn, mở Zalo để dán"); }
    catch(err){ const r=document.createRange(); r.selectNodeContents($("lvMsg")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Đã chọn, bấm giữ để sao chép"); }
  }
  else if(act==="loansave" && loanFor){
    const x=loanCalc(), id=loanFor;
    const text=`🧮 Tính vay: căn ${vn(L.price)} tỷ, vay ${L.ltv}% ${L.yrs} năm (${L.method==="dec"?"dư nợ giảm dần":"trả đều"}), tháng đầu ~${money(x.first)}, sau ưu đãi ~${money(x.after)}`;
    patch(id,c=>{ c.notes=c.notes||[]; c.notes.unshift({t:Date.now(),text}); });
    toast("Đã lưu vào nhật ký khách");
  }
  else if(act==="pickdate"){ const i=$("followIn"); try{ i.showPicker(); }catch(err){ i.style.pointerEvents="auto"; i.focus(); i.click(); } }
  else if(act==="paste"){
    try{ const t=await navigator.clipboard.readText(); const d=digits(t); if(d.length>=9){ $("f-phone").value=d; checkDup(); $("f-name").focus(); } else toast("Bộ nhớ tạm không có số điện thoại"); }
    catch(err){ $("f-phone").focus(); toast("Bấm giữ vào ô số điện thoại rồi chọn Dán", null, null, 3500); }
  }
  else if(act==="copy"){
    try{ await navigator.clipboard.writeText(c.phone); toast("Đã chép số "+c.phone); }
    catch(err){ const s=document.querySelector(".phone"); const r=document.createRange(); r.selectNodeContents(s); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Đã chọn số, bấm giữ để sao chép"); }
  }
  else if(act==="addnote"){
    stopMic();
    const text=$("noteText").value.trim(); if(!text){ $("noteText").focus(); return; }
    $("noteText").value="";
    patch(openId,n=>{ n.notes=n.notes||[]; n.notes.unshift({t:Date.now(), text}); if(n.status==="new") n.status="talk"; });
    toast("Đã lưu ghi chú");
  }
});
$("sheetBody").addEventListener("submit", e=>{
  e.preventDefault();
  const f=new FormData(e.target), name=String(f.get("name")||"").trim();
  if(!name){ $("formErr").hidden=false; $("f-name").focus(); return; }
  if($("f-tag").value.trim()) addTagFromInput();
  const base = mode==="edit" ? structuredClone(customers[openId]) : {notes:[], createdAt:Date.now()};
  const ph=String(f.get("phone")||"").trim();
  const obj={...base, name, phone: digits(ph).length>=9 ? digits(ph) : ph, status:f.get("status"), heat:f.get("heat")||"", projects:[...formTags], ptypes:[...formTypes],
    budget:String(f.get("budget")||"").trim().replace(/\s*tỷ\s*$/i,""), payment:f.get("payment")||"",
    company:String(f.get("company")||"").trim(), need:String(f.get("need")||"").trim(), address:String(f.get("address")||"").trim(),
    nextFollow:f.get("nextFollow")||"", updatedAt:Date.now()};
  const note=String(f.get("note")||"").trim(); if(note) obj.notes=[{t:Date.now(),text:note}];
  const id = mode==="edit" ? openId : newId();
  const wasEdit = mode==="edit";
  store.save(id,obj); toast(wasEdit?"Đã cập nhật":"Đã thêm khách");
  if(!wasEdit && query){ query=""; $("q").value=""; render(); }
  openId=id; mode="view"; renderDetail.last=null; renderDetail();
});

/* ========= khởi động ========= */
customers = ls.get("skh-cache", {}) || {};
pending = ls.get("skh-pending", []) || [];
token = ls.get("skh-token", "") || "";
{ const s=ls.get("skh-filters",null); if(s&&s.F){ F={...F,...s.F}; sortBy=s.sortBy||"recent"; } }
if(token) start(); else $("login").hidden=false;
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
